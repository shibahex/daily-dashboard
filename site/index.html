function findTask(uuid) { return tasks.find(t => t.uuid === uuid) || allTasks?.find(t => t.uuid === uuid); }

// ---------- repeat schedules ----------
// Taskwarrior keeps one hidden "template" per repeating series; "Mon, Wed, Fri" is three series
// with the same name. A "group" is all templates sharing a name + project.
const SHORT_DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function recurInfo(r) {
  r = String(r || "").toLowerCase();
  const named = { daily: [1, "d"], day: [1, "d"], weekly: [1, "w"], week: [1, "w"], biweekly: [2, "w"], fortnight: [2, "w"],
    monthly: [1, "m"], month: [1, "m"], quarterly: [3, "m"], yearly: [1, "y"], annual: [1, "y"], weekdays: [1, "weekdays"] };
  if (named[r]) return { n: named[r][0], unit: named[r][1] };
  let m = r.match(/^p(\d+)([dwmy])$/);
  if (m) { const n = +m[1], u = m[2]; return u === "d" && n % 7 === 0 ? { n: n / 7, unit: "w" } : { n, unit: u }; }
  m = r.match(/^(\d+)\s*(d|days?|w|wks?|weeks?|mo|mths?|months?|y|yrs?|years?)$/);
  if (m) { const u = m[2][0] === "m" ? "m" : m[2][0]; return u === "d" && +m[1] % 7 === 0 ? { n: +m[1] / 7, unit: "w" } : { n: +m[1], unit: u }; }
  return { n: 0, unit: r };
}
function templateOf(t) { return !t ? null : t.status === "recurring" ? t : t.parent ? allTasks?.find(x => x.uuid === t.parent) : null; }
function groupOf(t) {
  const tpl = templateOf(t);
  if (!tpl || !allTasks) return [];
  return allTasks.filter(x => x.status === "recurring" && x.description === tpl.description && (x.project || "") === (tpl.project || ""));
}
function scheduleSummary(group) {
  if (!group.length) return "Doesn't repeat";
  const infos = group.map(g => ({ ...recurInfo(g.recur), day: twDate(g.due)?.getDay(), due: twDate(g.due) }));
  if (infos.every(i => i.unit === "w" && i.n === infos[0].n)) {
    const days = [...new Set(infos.map(i => i.day))].sort().map(d => SHORT_DAYS[d]).join(", ");
    return `${infos[0].n === 1 ? "Every week" : `Every ${infos[0].n} weeks`} on ${days}`;
  }
  return infos.map(i => i.unit === "d" ? (i.n === 1 ? "Every day" : `Every ${i.n} days`)
    : i.unit === "m" ? `${i.n === 1 ? "Monthly" : `Every ${i.n} months`} on the ${i.due ? ordinal(i.due.getDate()) : "same day"}`
    : i.unit === "w" ? `Every ${i.n === 1 ? "week" : i.n + " weeks"} on ${SHORT_DAYS[i.day]}`
    : i.unit === "y" ? "Yearly" : i.unit === "weekdays" ? "Every weekday" : `Repeats (${esc(i.unit)})`).join(" + ");
}
const ordinal = n => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
function nextDueOf(group) {
  const ids = new Set(group.map(g => g.uuid));
  return tasks.filter(t => ids.has(t.parent)).map(t => twDate(t.due)).filter(Boolean).sort((a, b) => a - b)[0] || null;
}
// Starting values for the schedule form, from the current schedule.
function ruleFrom(group, t) {
  const next = nextDueOf(group) || twDate(t.due) || new Date();
  const info = group.length ? recurInfo(group[0].recur) : { n: 1, unit: "w" };
  const type = info.unit === "d" ? "days" : info.unit === "m" ? "monthly" : "weekly";
  const days = group.length && info.unit === "w" ? [...new Set(group.map(g => twDate(g.due).getDay()))] : [next.getDay()];
  return { type, every: info.n || 1, days, start: dayKey(next) };
}
// Next few dates a rule would produce (for the preview line); mirrors the server's series_plan.
function previewRule(r) {
  const today = startOfDay(now), out = [];
  let start = new Date(r.start + "T12:00:00"); if (isNaN(start)) start = new Date(today);
  if (r.type === "days") { while (start < today) start.setDate(start.getDate() + r.every); for (let i = 0; i < 4; i++) { out.push(new Date(start)); start.setDate(start.getDate() + r.every); } }
  else if (r.type === "weekly") {
    for (const d of r.days) {
      const f = new Date(start); f.setDate(f.getDate() + ((d - f.getDay() + 7) % 7));
      while (f < today) f.setDate(f.getDate() + 7 * r.every);
      for (let i = 0; i < 4; i++) { out.push(new Date(f)); f.setDate(f.getDate() + 7 * r.every); }
    }
    out.sort((a, b) => a - b); out.length = Math.min(out.length, 5);
  } else { const f = new Date(start); f.setDate(Math.min(f.getDate(), 28)); while (f < today) f.setMonth(f.getMonth() + 1); for (let i = 0; i < 3; i++) { out.push(new Date(f)); f.setMonth(f.getMonth() + 1); } }
  return out;
}

function repeatHtml(t) {
  const group = groupOf(t), r = ruleFrom(group, t);
  return `<div class="wide repeat" data-rule='${esc(JSON.stringify(r))}'>
    <span>Repeat</span>
    <div class="rep-summary"><b>${esc(scheduleSummary(group))}</b>${group.length ? ` <span class="small muted">· next ${esc(fmtDay(nextDueOf(group) || twDate(t.due) || now))}</span>` : ""}
      <button type="button" class="sm" data-rep-open>${group.length ? "Change schedule" : "Make it repeat"}</button></div>
    <div class="rep-form" hidden>
      <div class="seg rep-type"><button type="button" data-rtype="days">Every N days</button><button type="button" data-rtype="weekly">On weekdays</button><button type="button" data-rtype="monthly">Monthly</button></div>
      <div class="rep-row" data-show="days">Every <input class="txt num" type="number" min="1" max="60" data-every-days> day(s)</div>
      <div class="rep-row" data-show="weekly"><span class="daypick">${SHORT_DAYS.map((d, i) => `<button type="button" data-wd="${i}">${d}</button>`).join("")}</span>
        every <select class="txt" data-every-weeks>${[1, 2, 3, 4].map(n => `<option value="${n}">${n === 1 ? "week" : n === 2 ? "2 weeks (every other)" : n + " weeks"}</option>`).join("")}</select></div>
      <div class="rep-row" data-show="monthly">On the same day each month as the start date.</div>
      <div class="rep-row">Starting <input class="txt" type="date" data-start></div>
      <div class="rep-preview small muted"></div>
      <div class="rep-actions">${group.length ? `<button type="button" class="sm ghost" data-rep-stop>Stop repeating</button>` : "<span></span>"}
        <span><button type="button" class="sm" data-rep-cancel>Cancel</button> <button type="button" class="sm primary" data-rep-save>Save schedule</button></span></div>
      <div class="small muted">Saving rebuilds the repeating series in Taskwarrior; missed copies of the old schedule are removed.</div>
    </div>
  </div>`;
}

function wireRepeat(form, t) {
  const box = form.querySelector(".repeat");
  if (!box) return;
  const rule = JSON.parse(box.dataset.rule), group = groupOf(t);
  const q = s => box.querySelector(s);
  const draw = () => {
    box.querySelectorAll("[data-rtype]").forEach(b => b.classList.toggle("on", b.dataset.rtype === rule.type));
    box.querySelectorAll("[data-show]").forEach(row => row.hidden = row.dataset.show !== rule.type);
    box.querySelectorAll("[data-wd]").forEach(b => b.classList.toggle("on", rule.days.includes(+b.dataset.wd)));
    const dates = previewRule(rule);
    q(".rep-preview").textContent = dates.length ? "Next: " + dates.map(fmtDay).join(", ") + "…" : "";
  };
  q("[data-every-days]").value = rule.type === "days" ? rule.every : 1;
  q("[data-every-weeks]").value = rule.type === "weekly" ? Math.min(rule.every, 4) : 1;
  q("[data-start]").value = rule.start;
  q("[data-rep-open]").onclick = () => { q(".rep-form").hidden = false; q(".rep-summary").hidden = true; draw(); };
  q("[data-rep-cancel]").onclick = () => { q(".rep-form").hidden = true; q(".rep-summary").hidden = false; };
  box.querySelectorAll("[data-rtype]").forEach(b => b.onclick = () => {
    rule.type = b.dataset.rtype;
    rule.every = rule.type === "days" ? +q("[data-every-days]").value || 1 : rule.type === "weekly" ? +q("[data-every-weeks]").value : 1;
    draw();
  });
  box.querySelectorAll("[data-wd]").forEach(b => b.onclick = () => {
    const d = +b.dataset.wd;
    rule.days = rule.days.includes(d) ? rule.days.filter(x => x !== d) : [...rule.days, d];
    draw();
  });
  q("[data-every-days]").oninput = e => { rule.every = Math.max(1, Math.min(60, +e.target.value || 1)); draw(); };
  q("[data-every-weeks]").onchange = e => { rule.every = +e.target.value; draw(); };
  q("[data-start]").onchange = e => { rule.start = e.target.value; draw(); };
  q("[data-rep-save]").onclick = async () => {
    if (rule.type === "weekly" && !rule.days.length) return toast("Pick at least one day", true);
    try {
      const r = await post("/api/series/schedule", { source: t.uuid, templates: group.map(g => g.uuid), rule: { ...rule, every: rule.type === "monthly" ? 1 : rule.every } });
      openEditor = null; toast(`Schedule saved${r.series > 1 ? ` (${r.series} weekly series)` : ""}`, false, true); await refreshTasks();
    } catch (e) { toast(e.message, true); }
  };
  const stop = q("[data-rep-stop]");
  if (stop) stop.onclick = async () => {
    if (!confirm(`Stop repeating “${t.description}”? Its pending copies are removed too.`)) return;
    try { await post("/api/series/stop", { templates: group.map(g => g.uuid) }); openEditor = null; toast("No longer repeats", false, true); await refreshTasks(); }
    catch (e) { toast(e.message, true); }
  };
}

function wireEditor(el) {
  el.querySelectorAll("form[data-editor]").forEach(form => {
    const t = findTask(form.dataset.editor);
    if (!t) return;
    form.querySelector("[data-cancel]").onclick = () => { openEditor = null; renderAllTaskViews(); };
    wireRepeat(form, t);
    form.querySelectorAll("[data-denotate]").forEach(b => b.onclick = async () => {
      const a = t.annotations[+b.dataset.denotate];
      try { await post("/api/tasks/denotate", { uuid: t.uuid, text: a.description }); toast("Note removed", false, true); await refreshTasks(); }
      catch (e) { toast(e.message, true); }
    });
    const addNote = async () => {
      const text = form.note.value.trim(); if (!text) return;
      try { await post("/api/tasks/annotate", { uuid: t.uuid, text }); toast("Note added", false, true); await refreshTasks(); }
      catch (e) { toast(e.message, true); }
    };
    form.querySelector("[data-annotate]").onclick = addNote;
    form.note.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addNote(); } };
    form.onsubmit = async e => {
      e.preventDefault();
      // Send only what changed.
      const f = {}, v = n => form[n].value.trim();
      if (v("description") !== t.description) f.description = v("description");
      if (v("project") !== (t.project || "")) f.project = v("project");
      if (v("priority") !== (t.priority || "")) f.priority = v("priority");
      for (const k of ["due", "scheduled", "wait", "end"]) if (form[k] && v(k) !== twInput(t[k])) f[k] = v(k);
      const oldTags = new Set(t.tags || []), newTags = new Set(v("tags").split(/[\s,]+/).map(s => s.replace(/^\+/, "")).filter(Boolean));
      const add = [...newTags].filter(x => !oldTags.has(x)), rem = [...oldTags].filter(x => !newTags.has(x));
      if (add.length) f.tags_add = add;
      if (rem.length) f.tags_remove = rem;
      if (!Object.keys(f).length) { openEditor = null; renderAllTaskViews(); return; }
      try {
        await post("/api/tasks/modify", { uuid: t.uuid, fields: f, scope: form.scope?.value || "one", templates: groupOf(t).map(g => g.uuid) });
        openEditor = null; toast("Saved", false, true); await refreshTasks();
      } catch (err) { toast(err.message, true); }
    };
  });
}

function wire(el) {
  el.querySelectorAll("[data-open]").forEach(x => x.onclick = () => {
    openEditor = openEditor === x.dataset.open ? null : x.dataset.open;
    renderAllTaskViews();
    if (openEditor) el.querySelector(`form[data-editor="${openEditor}"] input[name=description]`)?.focus();
  });
  el.querySelectorAll("button[data-act]").forEach(btn => btn.onclick = async () => {
    const act = btn.dataset.act;
    if (act === "skip" || act === "dismiss") return askReason(btn, act);
    if (act === "done" && !btn.dataset.active) return askDone(btn);
    if (act === "done-on") return askDoneOn(btn);
    if (act === "catchup") return askCatchUp(btn);
    btn.disabled = true;
    try {
      await post("/api/tasks/" + act, { uuid: btn.dataset.uuid });
      toast({ done: "Done ✓", start: "Started", stop: "Stopped", reopen: "Reopened" }[act], false, true);
      await refreshTasks(); loadTime();
    } catch (e) { toast("Taskwarrior: " + e.message, true); btn.disabled = false; }
  });
  wireEditor(el);
}

// Panels that open under a task's buttons (one at a time per task).
function openPanel(btn, cls, html) {
  const actions = btn.closest(".actions");
  actions.parentElement.querySelectorAll(".reason, .panel").forEach(x => x.remove());
  const box = document.createElement("div");
  box.className = "panel " + cls;
  box.innerHTML = html;
  actions.after(box);
  return box;
}
const hhmm = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;  // for inputs
// For display, 12-hour: "7:00 PM". A range shows AM/PM once when both ends share it: "7:00–7:45 PM".
const clock12 = d => `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")}`;
const ampm = d => d.getHours() < 12 ? "AM" : "PM";
const timeRange = (s, e) => !e ? `${clock12(s)} ${ampm(s)}–now`
  : ampm(s) === ampm(e) ? `${clock12(s)}–${clock12(e)} ${ampm(e)}` : `${clock12(s)} ${ampm(s)}–${clock12(e)} ${ampm(e)}`;

// How long something took: "30", "45m", "1h", "1.5h", "1h30", "1h 30m", "2 hours", "1:30".
// Returns minutes, null when blank (don't log time), NaN when it can't be read.
function parseMins(s) {
  s = String(s || "").trim().toLowerCase();
  if (!s) return null;
  let m = s.match(/^(\d+):(\d{1,2})$/);
  if (m) return +m[1] * 60 + +m[2];
  m = s.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?)?\s*(?:(\d+)\s*(?:m(?:ins?|inutes?)?)?)?$/);
  if (!m || (!m[1] && !m[2])) return NaN;
  return Math.round((+m[1] || 0) * 60 + (+m[2] || 0));
}
// Reads a "took" box; toasts and returns undefined when the value is unusable.
function readMins(input) {
  const m = parseMins(input.value);
  if (m === null || (m >= 1 && m <= 1440)) return m;
  toast("Time taken: use minutes or hours, like 30, 45m, 1h 30m (up to 24h)", true);
  input.focus();
}
const TOOK_INPUT = `<input class="txt num" data-m value="30" placeholder="30m" title="Minutes or hours: 30, 45m, 1h, 1h 30m. Leave blank to not log time.">`;
const fmtMins = m => m < 60 ? `${m} min` : fmtDur(m * 60000);

// "Done": ask how long it took (default 30 min) and log that in Timewarrior, ending now.
// A task that was started with Start skips this: its timer already logged the real time.
function askDone(btn) {
  const box = openPanel(btn, "done", `
    <label>Took ${TOOK_INPUT}</label>
    <span class="small muted">e.g. 45m, 1h 30m; blank = don't log</span>
    <span><button class="sm primary" data-ok>Done</button> <button class="sm" data-x>Cancel</button></span>`);
  const q = s => box.querySelector(s), input = q("[data-m]");
  input.focus(); input.select();
  q("[data-x]").onclick = () => box.remove();
  const go = async () => {
    const m = readMins(input);
    if (m === undefined) return;
    q("[data-ok]").disabled = true;
    try {
      const r = m ? await post("/api/tasks/done_at", { uuid: btn.dataset.uuid, end: `${todayKey}T${hhmm(new Date())}`, minutes: m })
                  : await post("/api/tasks/done", { uuid: btn.dataset.uuid });
      r.warning ? toast(r.warning, true) : toast(`Done ✓${m ? ` · ${fmtMins(m)} logged` : ""}`, false, true);
      await refreshTasks(); loadTime(); loadTimeLog();
    } catch (e) { toast("Taskwarrior: " + e.message, true); q("[data-ok]").disabled = false; }
  };
  q("[data-ok]").onclick = go;
  input.onkeydown = e => { if (e.key === "Enter") go(); if (e.key === "Escape") box.remove(); };
}

// "Done on…": complete as of an earlier day/time, optionally logging how long it took.
function askDoneOn(btn) {
  const due = btn.dataset.due, past = due && due < todayKey;
  const day = past ? due : todayKey;
  const box = openPanel(btn, "done-on", `
    <label>Done on <input class="txt" type="date" data-d value="${day}" max="${todayKey}"></label>
    <label>at <input class="txt" type="time" data-t value="${day === todayKey ? hhmm(new Date()) : "20:00"}"></label>
    <label>took ${TOOK_INPUT} <span class="small muted">(blank = don't log time)</span></label>
    <span><button class="sm primary" data-ok>Mark done</button> <button class="sm" data-x>Cancel</button></span>`);
  const q = s => box.querySelector(s);
  q("[data-d]").onchange = e => { if (e.target.value !== todayKey && q("[data-t]").value === hhmm(new Date())) q("[data-t]").value = "20:00"; };
  q("[data-x]").onclick = () => box.remove();
  q("[data-ok]").onclick = async () => {
    const d = q("[data-d]").value, t = q("[data-t]").value || "20:00", m = readMins(q("[data-m]"));
    if (m === undefined) return;
    if (!d) return toast("Pick a date", true);
    if (d > todayKey) return toast("That's in the future", true);
    q("[data-ok]").disabled = true;
    try {
      const r = await post("/api/tasks/done_at", { uuid: btn.dataset.uuid, end: `${d}T${t}`, minutes: m });
      r.warning ? toast(r.warning, true) : toast(`Marked done on ${fmtDay(new Date(d + "T12:00:00"))}${m ? ` · ${fmtMins(m)} logged` : ""}`, false, true);
      await refreshTasks(); loadTime(); loadTimeLog();
    } catch (e) { toast(e.message, true); q("[data-ok]").disabled = false; }
  };
}

// "Catch up": go through each missed copy of a repeating task and mark it done that day or skip it.
function askCatchUp(btn) {
  const today = startOfDay(now);
  const missed = tasks.filter(t => t.parent === btn.dataset.parent && twDate(t.due) < today).sort((a, b) => a.due.localeCompare(b.due));
  const box = openPanel(btn, "catchup", `
    <div class="small muted">Mark each missed day as done (on that day) or skip it.
      Time per session ${TOOK_INPUT} <span>(blank = don't log time)</span></div>
    ${missed.map(t => `<div class="cu-row" data-u="${t.uuid}" data-day="${dayKey(twDate(t.due))}"><span>${esc(fmtDay(twDate(t.due)))}</span>
      <span class="cu-btns">${CU_BTNS}</span></div>`).join("")}
    <div class="rep-actions"><span class="cu-btns" data-rest>${CU_REST}</span><button class="sm" data-close>Close</button></div>`);
  let changed = false, lastNote = "";
  const finish = async () => { box.remove(); if (changed) { await refreshTasks(); loadTime(); loadTimeLog(); } };
  const rows = () => [...box.querySelectorAll(".cu-row:not(.handled)")];
  // Skip asks why first (optional), in place of the buttons. The last reason is prefilled,
  // since missed days in a row usually share one.
  const askWhy = (slot, label, restore, go) => {
    slot.innerHTML = `<input class="txt" maxlength="300" placeholder="Why? (optional)" value="${esc(lastNote)}">
      <button class="sm primary">${label}</button><button class="sm">Cancel</button>`;
    const [input, ok, cancel] = slot.children;
    input.focus(); input.select();
    const confirm = async () => {
      ok.disabled = true; lastNote = input.value.trim();
      try { await go(lastNote); } catch (e) { toast(e.message, true); ok.disabled = false; }
    };
    ok.onclick = confirm;
    cancel.onclick = () => { slot.innerHTML = restore; };
    input.onkeydown = e => { if (e.key === "Enter") confirm(); if (e.key === "Escape") cancel.onclick(); };
  };
  const skipped = (row, note) => {
    row.querySelector(".cu-btns").innerHTML = `<span class="why">↷ skipped · ${whyBtn(note, `data-why-uuids="${row.dataset.u}"`)}</span>`;
    row.classList.add("handled"); changed = true;
  };
  box.onclick = async e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cu === "skip") {
      const row = b.closest(".cu-row");
      return askWhy(b.parentElement, "Skip", CU_BTNS, async note => {
        await post("/api/tasks/skip", { uuids: [row.dataset.u], note, kind: "skip" });
        skipped(row, note);
      });
    }
    if (b.dataset.cu === "done") {
      const row = b.closest(".cu-row"), m = readMins(box.querySelector("[data-m]"));
      if (m === undefined) return;
      row.querySelectorAll("button").forEach(x => x.disabled = true);
      try {
        const r = await post("/api/tasks/done_at", { uuid: row.dataset.u, end: `${row.dataset.day}T20:00`, minutes: m });
        row.querySelector(".cu-btns").innerHTML = `<span class="ok">✓ done${m ? ` · ${fmtMins(m)}` : ""}</span>${r.warning ? ` <span class="err small">${esc(r.warning)}</span>` : ""}`;
        row.classList.add("handled"); changed = true;
      } catch (err) { toast(err.message, true); row.querySelectorAll("button").forEach(x => x.disabled = false); }
      return;
    }
    if (b.hasAttribute("data-skip-rest")) {
      const rest = rows();
      if (!rest.length) return finish();
      return askWhy(b.parentElement, `Skip ${rest.length}`, CU_REST, async note => {
        await post("/api/tasks/skip", { uuids: rest.map(r => r.dataset.u), note, kind: "skip" });
        rest.forEach(r => skipped(r, note));
        toast(`Skipped ${rest.length}${note ? " · reason saved" : ""}`, false, true);
        finish();
      });
    }
    if (b.hasAttribute("data-close")) finish();
  };
}
const CU_BTNS = `<button class="sm primary" data-cu="done">Done that day</button><button class="sm ghost" data-cu="skip">Skip</button>`;
const CU_REST = `<button class="sm ghost" data-skip-rest>Skip all remaining</button>`;

// Inline "why?" box under the task's buttons. The reason is optional.
function askReason(btn, act) {
  const actions = btn.closest(".actions");
  actions.parentElement.querySelectorAll(".reason, .panel").forEach(x => x.remove());
  const uuids = btn.dataset.uuids.split(",");
  const what = act === "dismiss" ? "Dismiss" : uuids.length > 1 ? `Skip ${uuids.length}` : "Skip";
  const box = document.createElement("div");
  box.className = "reason";
  box.innerHTML = `<input class="txt" maxlength="300" placeholder="Why? e.g. sick, worked late, rest day (optional)">
    <button class="sm primary">${what}</button><button class="sm">Cancel</button>`;
  actions.after(box);
  const [input, ok, cancel] = box.children;
  input.focus();
  cancel.onclick = () => box.remove();
  const go = async () => {
    ok.disabled = true;
    try {
      await post("/api/tasks/skip", { uuids, note: input.value, kind: act });
      toast(act === "dismiss" ? "Dismissed" : `Skipped${uuids.length > 1 ? " " + uuids.length : ""}${input.value.trim() ? " · reason saved" : ""}`, false, true);
      await refreshTasks();
    } catch (e) { toast("Taskwarrior: " + e.message, true); ok.disabled = false; }
  };
  ok.onclick = go;
  input.onkeydown = e => { if (e.key === "Enter") go(); if (e.key === "Escape") box.remove(); };
}

function matches(t, q) { return !q || `${t.description} ${t.project || ""} ${(t.tags || []).join(" ")} ${(t.annotations || []).map(a => a.description).join(" ")}`.toLowerCase().includes(q); }

function renderTasks() {
  const grouped = groupTasks(tasks).sort((a, b) => (a.dueDate || Infinity) - (b.dueDate || Infinity) || b.urgency - a.urgency);
  const q = $("#filter").value.toLowerCase();
  const el = $("#all-tasks");
  el.classList.remove("muted");
  document.querySelectorAll("#task-views button").forEach(b => b.classList.toggle("on", b.dataset.view === taskView));
  if (taskView === "pending") {
    const shown = grouped.filter(t => matches(t, q));
    const sections = [["overdue", "Overdue"], ["today", "Due today"], ["week", "Next 7 days"], ["later", "Later"], ["none", "No due date"]];
    el.innerHTML = shown.length ? sections.map(([k, label]) => {
      const items = shown.filter(t => bucket(t) === k);
      return items.length ? `<div class="section-title${k === "overdue" ? " warn" : ""}">${label} · ${items.length}</div>` + items.map(taskRow).join("") : "";
    }).join("") : `<p class="muted">No pending tasks${q ? " match" : ""}.</p>`;
  } else if (!allTasks) {
    el.innerHTML = `<p class="muted">Loading…</p>`;
  } else if (taskView === "repeating") {
    el.innerHTML = renderRepeating(q);
  } else {
    // Copies of a repeating task are one row (expandable). In Deleted, copies Taskwarrior or a
    // reschedule removed without a reason are hidden unless asked for.
    const why = t => (t.annotations || []).some(a => /^(Skipped|Dismissed)/.test(a.description));
    let list = allTasks.filter(t => t.status === taskView && matches(t, q));
    let hidden = 0;
    if (taskView === "deleted" && !showAutoDeleted) {
      const keep = list.filter(t => !((t.parent || t.recur) && !why(t)));
      hidden = list.length - keep.length; list = keep;
    }
    const groups = new Map();
    for (const t of list) {
      const key = t.parent || t.recur ? "r|" + t.description + "|" + (t.project || "") : t.uuid;
      if (!groups.has(key)) groups.set(key, { key, items: [] });
      groups.get(key).items.push(t);
    }
    const rows = [...groups.values()].map(g => (g.items.sort((a, b) => (b.end || "").localeCompare(a.end || "")), g))
      .sort((a, b) => (b.items[0].end || "").localeCompare(a.items[0].end || ""));
    el.innerHTML = (taskView === "deleted" ? `<label class="small muted toggle"><input type="checkbox" id="show-auto"${showAutoDeleted ? " checked" : ""}> Show repeat copies removed without a reason${hidden ? ` (${hidden} hidden)` : ""}</label>` : "") +
      (rows.length
        ? `<div class="section-title">${list.length} ${taskView}${rows.length !== list.length ? ` · ${rows.length} tasks` : ""}</div>` + rows.slice(0, doneLimit).map(groupRow).join("") +
          (rows.length > doneLimit ? `<button class="sm" id="more-done" style="margin-top:10px">Show ${Math.min(50, rows.length - doneLimit)} more</button>` : "")
        : `<p class="muted">No ${taskView} tasks${q ? " match" : ""}.</p>`);
    const more = $("#more-done"); if (more) more.onclick = () => { doneLimit += 50; renderTasks(); };
    const auto = $("#show-auto"); if (auto) auto.onchange = () => { showAutoDeleted = auto.checked; renderTasks(); };
    el.querySelectorAll("[data-expand]").forEach(b => b.onclick = () => { const k = b.dataset.expand; expanded.has(k) ? expanded.delete(k) : expanded.add(k); renderTasks(); });
  }
  wire(el);
}

let showAutoDeleted = false;
const expanded = new Set();
function groupRow(g) {
  if (g.items.length === 1) return closedRow(g.items[0]);
  const last = g.items[0], first = g.items.at(-1), verb = last.status === "completed" ? "completed" : "deleted";
  const open = expanded.has(g.key);
  return `<div class="task">
    <div class="title">${esc(last.description)} <span class="badge">×${g.items.length}</span></div>
    <div class="meta"><span>${verb} ${g.items.length} times · last ${esc(fmtDay(twDate(last.end)))}${first.end ? `, first ${esc(fmtDay(twDate(first.end)))}` : ""}</span>${last.project ? `<span class="badge">${esc(last.project)}</span>` : ""}</div>
    <div class="actions"><button class="sm" data-expand="${esc(g.key)}">${open ? "Hide copies" : "Show copies"}</button></div>
    ${open ? `<div class="copies">${g.items.map(t => {
      const why = skipLine(t);
      return `<div class="copy"><span>${esc(fmtDay(twDate(t.end)))}${t.due ? ` <span class="muted small">(was due ${esc(fmtDay(twDate(t.due)))})</span>` : ""}${why ? ` · ${why}` : ""}</span>
        <button class="sm" data-act="reopen" data-uuid="${t.uuid}">${verb === "completed" ? "Reopen" : "Restore"}</button></div>`;
    }).join("")}</div>` : ""}
  </div>`;
}

// One row per repeating task (all its series together), so you edit the task, not a copy.
function renderRepeating(q) {
  const groups = new Map();
  for (const t of allTasks.filter(t => t.status === "recurring")) {
    const k = t.description + "|" + (t.project || "");
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  const rows = [...groups.values()].filter(g => matches(g[0], q))
    .map(g => ({ g, next: nextDueOf(g) })).sort((a, b) => (a.next || Infinity) - (b.next || Infinity));
  if (!rows.length) return `<p class="muted">No repeating tasks${q ? " match" : ""}. Use “Make it repeat” when editing a task, or pick a repeat when adding one.</p>`;
  return `<div class="section-title">${rows.length} repeating</div>` + rows.map(({ g, next }) => {
    const ids = new Set(g.map(x => x.uuid));
    const rep = tasks.filter(t => ids.has(t.parent)).sort((a, b) => (a.due || "").localeCompare(b.due || ""))[0] || g[0];
    const missed = tasks.filter(t => ids.has(t.parent) && twDate(t.due) < startOfDay(now)).length;
    return `<div class="task">
      <div class="title" data-open="${rep.uuid}" title="Click to edit">${esc(g[0].description)}</div>

}

// ---------- history ----------
// Why things were skipped: checklist skips + tasks deleted with a "Skipped:"/"Dismissed:" note.
function taskSkips() {
  const out = [];
  for (const t of allTasks || []) {
    if (t.status !== "deleted") continue;
    for (const a of t.annotations || []) {
      const text = a.description || "";
      if (/^(Skipped|Dismissed)/.test(text))
        out.push({ uuid: t.uuid, description: t.description, due: t.due, kind: text.startsWith("Dismissed") ? "dismiss" : "skip", note: text.includes(":") ? text.split(":").slice(1).join(":").trim() : "", at: a.entry });
    }
  }
  return out;
}
function loadHistory() { renderHistory(); }

function renderHistory() {
  const days = new Map();
  const day = k => { if (!days.has(k)) days.set(k, { checks: [], tasks: new Map() }); return days.get(k); };
  for (const [k, items] of Object.entries(checklist))
    for (const [item, v] of Object.entries(items))
      if (cellState(v) === "skip") day(k).checks.push({ item, note: cellNote(v) });
  // Task skips, by the day you skipped them. Copies skipped together are one entry.
  for (const s of taskSkips()) {
    const k = dayKey(twDate(s.at));
    const g = day(k).tasks, key = `${s.description}|${s.kind}|${s.note}|${s.at}`;
    if (!g.has(key)) g.set(key, { ...s, count: 0, dues: [], uuids: [] });
    const e = g.get(key); e.count++; e.uuids.push(s.uuid); if (s.due) e.dues.push(twDate(s.due));
  }
  const el = $("#history");
  el.classList.remove("muted");
  const fmt = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const keys = [...days.keys()].filter(k => days.get(k).checks.length || days.get(k).tasks.size).sort().reverse();
  el.innerHTML = keys.length ? keys.map(k => {
    const d = days.get(k), date = new Date(k + "T12:00:00");
    const r = dayRatio(k), st = checklist[k] || {};
    const doneN = plan.checklist.filter(i => cellState(st[i]) === "done").length, skipN = plan.checklist.filter(i => cellState(st[i]) === "skip").length;
    return `<div class="hist-day"><h3><span>${date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</span>
        <span class="small muted">${checklist[k] ? `checklist ${doneN} done · ${skipN} skipped${r >= 1 ? " · complete ✓" : ""}` : ""}</span></h3>
      ${d.checks.map(c => `<div class="hist-item">${esc(c.item)} · ${whyBtn(c.note, `data-why-day="${k}" data-why-item="${esc(c.item)}"`)}</div>`).join("")}
      ${[...d.tasks.values()].map(t => {
        const dues = t.dues.sort((a, b) => a - b);
        const span = t.count > 1 && dues.length ? ` <span class="muted small">${t.count} copies, ${fmt(dues[0])}–${fmt(dues.at(-1))}</span>` : "";
        return `<div class="hist-item${t.kind === "dismiss" ? " dismiss" : ""}"><b>${esc(t.description)}</b> <span class="badge">task</span>${span} · ${whyBtn(t.note, `data-why-uuids="${t.uuids.join(",")}"`)}</div>`;
      }).join("")}</div>`;
  }).join("") : `<p class="muted">Nothing skipped yet. When you skip a checklist item or a task, the day and your reason show up here.</p>`;
}

// ---------- activity: heatmap + feed ----------
let hmMode = "tasks", selectedDay = null, feedDays = 10, yearIntervals = null;
try { hmMode = localStorage.getItem("hmMode") || "tasks"; } catch {}

async function loadYearTime() {
  try { const j = await (await fetch("/api/time?range=year")).json(); yearIntervals = j.available ? j.intervals : []; }
  catch { yearIntervals = []; }
  renderActivity();
}

function hoursByDay() {
  const m = new Map();
  for (const iv of yearIntervals || []) {
    const s = twDate(iv.start), e = iv.end ? twDate(iv.end) : new Date();
    const k = dayKey(s); m.set(k, (m.get(k) || 0) + (e - s) / 3.6e6);
  }
  return m;
}

// One entry per thing that happened, by local day.
function taskEvents() {
  const ev = [];
  for (const t of allTasks || []) {
    if (t.status === "completed" && t.end) ev.push({ day: dayKey(twDate(t.end)), type: "done", t });
    if (t.status === "deleted" && t.end) {
      const why = (t.annotations || []).map(a => a.description).find(a => /^(Skipped|Dismissed)/.test(a));
      ev.push({ day: dayKey(twDate(t.end)), type: why?.startsWith("Dismissed") ? "dismiss" : why ? "skip" : "deleted", t, note: why && why.includes(":") ? why.split(":").slice(1).join(":").trim() : "" });
    }
    if (!t.parent && t.entry) ev.push({ day: dayKey(twDate(t.entry)), type: t.status === "recurring" ? "repeat" : "added", t });
    if (t.start && t.status === "pending") ev.push({ day: dayKey(twDate(t.start)), type: "started", t });
  }
  return ev;
}

function heatValues() {
  const m = new Map();
  if (hmMode === "tasks") for (const e of taskEvents()) { if (e.type === "done") m.set(e.day, (m.get(e.day) || 0) + 1); }
  else if (hmMode === "hours") for (const [k, h] of hoursByDay()) m.set(k, h);
  else for (const k of Object.keys(checklist)) { const r = dayRatio(k); if (r > 0) m.set(k, r); }
  return m;
}

function renderActivity() {
  const hm = $("#heatmap");
  if (!hm) return;
  document.querySelectorAll("#hm-mode button").forEach(b => b.classList.toggle("on", b.dataset.mode === hmMode));
  if (!allTasks) { hm.innerHTML = `<p class="muted">Loading…</p>`; return; }
  if (hmMode === "hours" && !yearIntervals) { hm.innerHTML = `<p class="muted">Loading Timewarrior…</p>`; loadYearTime(); return; }
  // 53 weeks ending this week, Sunday-first columns like GitHub.
  const end = startOfDay(now), start = new Date(end);
  start.setDate(start.getDate() - 364 - start.getDay());
  const startKey = dayKey(start);
  const vals = new Map([...heatValues()].filter(([k]) => k >= startKey && k <= todayKey));
  // Shade by quartiles of the active days, so one huge day doesn't wash out the rest.
  const sorted = [...vals.values()].filter(Boolean).sort((a, b) => a - b);
  const q = f => sorted[Math.min(sorted.length - 1, Math.floor(f * sorted.length))] ?? 0;
  const [q1, q2, q3] = [q(.25), q(.5), q(.75)];
  const level = v => !v ? 0 : hmMode === "checklist" ? (v >= 1 ? 4 : v >= .66 ? 3 : v >= .33 ? 2 : 1) : v > q3 ? 4 : v > q2 ? 3 : v > q1 ? 2 : 1;
  const cells = [], months = [];
  let col = 0, lastMonth = -1;
  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0) {
      if (d.getMonth() !== lastMonth) { months.push(`<span style="grid-column:${col + 1}">${d.toLocaleDateString(undefined, { month: "short" })}</span>`); lastMonth = d.getMonth(); }
      col++;
    }
    const k = dayKey(d), v = vals.get(k) || 0;
    const label = hmMode === "tasks" ? `${v} task${v === 1 ? "" : "s"} done` : hmMode === "hours" ? `${fmtDur(v * 3.6e6)} tracked` : `checklist ${Math.round(v * 100)}%`;
    cells.push(`<button class="hm-cell l${level(v)}${k === selectedDay ? " sel" : ""}" data-day="${k}" style="grid-row:${d.getDay() + 1}" title="${esc(fmtDay(d))}: ${label}"></button>`);
  }
  // Summary line + streak of active days.
  const total = [...vals.values()].reduce((a, b) => a + b, 0);
  let streak = 0; const s = new Date(end);
  if (!vals.get(dayKey(s))) s.setDate(s.getDate() - 1);
  while (vals.get(dayKey(s))) { streak++; s.setDate(s.getDate() - 1); }
  const activeDays = [...vals.values()].filter(Boolean).length;
  const summary = hmMode === "tasks" ? `${total} task${total === 1 ? "" : "s"} completed in the last year · ${activeDays} active day${activeDays === 1 ? "" : "s"}`
    : hmMode === "hours" ? `${fmtDur(total * 3.6e6)} tracked in the last year · ${activeDays} day${activeDays === 1 ? "" : "s"}`
    : `${[...vals.values()].filter(v => v >= 1).length} complete checklist days · ${activeDays} days with progress`;
  hm.innerHTML = `<div class="hm-wrap"><div class="hm-months" style="grid-template-columns:repeat(${col},11px)">${months.join("")}</div>
      <div class="hm-grid" style="grid-template-columns:repeat(${col},11px)">${cells.join("")}</div></div>
    <div class="hm-foot"><span class="small muted">${summary}${streak ? ` · current streak ${streak} day${streak === 1 ? "" : "s"}` : ""}</span>
      <span class="hm-legend small muted">Less <i class="hm-cell l0"></i><i class="hm-cell l1"></i><i class="hm-cell l2"></i><i class="hm-cell l3"></i><i class="hm-cell l4"></i> More</span></div>`;
  const wrap = hm.querySelector(".hm-wrap"); wrap.scrollLeft = wrap.scrollWidth;
  hm.querySelectorAll("[data-day]").forEach(c => c.onclick = () => { selectedDay = selectedDay === c.dataset.day ? null : c.dataset.day; renderActivity(); });
  renderFeed();
}

function renderFeed() {
  const byDay = new Map();
  for (const e of taskEvents()) { if (!byDay.has(e.day)) byDay.set(e.day, []); byDay.get(e.day).push(e); }
  for (const k of Object.keys(checklist)) if (!byDay.has(k) && Object.keys(checklist[k]).length) byDay.set(k, []);
  const hours = yearIntervals ? hoursByDay() : null;
  let keys = [...byDay.keys()].filter(k => k <= todayKey).sort().reverse();
  if (selectedDay) keys = [selectedDay];
  const shown = keys.slice(0, feedDays);
  const LABEL = { done: "Completed", added: "Added", repeat: "Added repeating", started: "Started", skip: "Skipped", dismiss: "Dismissed", deleted: "Deleted" };
  const ICON = { done: "✓", added: "+", repeat: "↻", started: "▶", skip: "↷", dismiss: "✕", deleted: "✕" };
  $("#feed-title").textContent = selectedDay ? new Date(selectedDay + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "Recent activity";
  $("#feed-clear").hidden = !selectedDay;
  $("#feed").innerHTML = shown.length ? shown.map(k => {
    const evs = byDay.get(k) || [];
    // Collapse repeats (e.g. 30 skipped copies of one task) into one line.
    const groups = new Map();
    for (const e of evs) {
      const key = `${e.type}|${e.t.description}|${e.note || ""}`;
      if (!groups.has(key)) groups.set(key, { ...e, count: 0 });
      groups.get(key).count++;
    }
    const order = ["done", "started", "added", "repeat", "skip", "dismiss", "deleted"];
    const items = [...groups.values()].sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type));
    const st = checklist[k], r = st ? dayRatio(k) : 0, h = hours?.get(k);
    const doneN = evs.filter(e => e.type === "done").length;
    return `<div class="hist-day"><h3><span>${esc(fmtDay(new Date(k + "T12:00:00")))}</span>
        <span class="small muted">${[doneN ? `${doneN} done` : "", h ? `${fmtDur(h * 3.6e6)} tracked` : "", st ? `checklist ${Math.round(r * 100)}%` : ""].filter(Boolean).join(" · ")}</span></h3>
      ${items.map(e => `<div class="feed-item ev-${e.type}"><span class="ev-icon">${ICON[e.type]}</span><span>${LABEL[e.type]} <b>${esc(e.t.description)}</b>${e.count > 1 ? ` <span class="badge">×${e.count}</span>` : ""}${e.t.project ? ` <span class="badge">${esc(e.t.project)}</span>` : ""}${e.note ? ` · <span class="why">${esc(e.note)}</span>` : ""}</span></div>`).join("") || `<div class="small muted">No task activity.</div>`}
    </div>`;
  }).join("") + (keys.length > feedDays ? `<button class="sm" id="feed-more" style="margin-top:10px">Show older</button>` : "")
    : `<p class="muted">${selectedDay ? "Nothing happened this day." : "No activity yet."}</p>`;
  const more = $("#feed-more"); if (more) more.onclick = () => { feedDays += 10; renderFeed(); };
}

document.querySelectorAll("#hm-mode button").forEach(b => b.onclick = () => {
  hmMode = b.dataset.mode; try { localStorage.setItem("hmMode", hmMode); } catch {}
  renderActivity();

$("#feed-clear").onclick = () => { selectedDay = null; renderActivity(); };

// ---------- time log: view, add and edit Timewarrior entries, any week ----------
let tlWeek = 0, tlIntervals = [], tlEdit = null;
function tlRange() {
  const mon = startOfDay(now); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) + tlWeek * 7);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return [mon, sun];
}
const localDT = d => `${dayKey(d)}T${hhmm(d)}`;
async function loadTimeLog() {
  const [mon, sun] = tlRange();
  try {
    const j = await (await fetch(`/api/time?from=${dayKey(mon)}&to=${dayKey(sun)}`)).json();
    if (j.error) throw new Error(j.error);
    tlIntervals = j.available ? j.intervals : null;
  } catch (e) { $("#timelog").innerHTML = `<p class="err">Timewarrior: ${esc(e.message)}</p>`; return; }
  renderTimeLog();
}
function renderTimeLog() {
  const [mon, sun] = tlRange();
  $("#wk-label").textContent = `${fmtDay(mon)} – ${fmtDay(sun)}`;
  const add = $("#tl-add");
  if (!add.day.value || add.day.value < dayKey(mon) || add.day.value > dayKey(sun)) add.day.value = tlWeek === 0 ? todayKey : dayKey(mon);
  // Suggest task names (pending + repeating) for the "what" box.
  $("#tl-tags").innerHTML = [...new Set([...tasks, ...(allTasks || []).filter(t => t.status === "recurring")].map(t => t.description))].sort().map(d => `<option value="${esc(d)}">`).join("");
  renderTaskPicker(add.task);
  const el = $("#timelog");
  el.classList.remove("muted");
  if (tlIntervals === null) { el.innerHTML = `<p class="muted small">Timewarrior isn't available. Start the dashboard with <code>nix run</code>.</p>`; return; }
  const byDay = new Map();
  for (const iv of tlIntervals) { const k = dayKey(twDate(iv.start)); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(iv); }
  const days = [...byDay.keys()].sort().reverse();
  const total = tlIntervals.reduce((s, iv) => s + ((iv.end ? twDate(iv.end) : new Date()) - twDate(iv.start)), 0);
  el.innerHTML = (days.length ? `<div class="small muted" style="margin-bottom:6px">${fmtDur(total)} this week</div>` : "") + (days.length ? days.map(k => {
    const ivs = byDay.get(k).sort((a, b) => a.start.localeCompare(b.start));
    const sum = ivs.reduce((s, iv) => s + ((iv.end ? twDate(iv.end) : new Date()) - twDate(iv.start)), 0);
    return `<div class="hist-day"><h3><span>${esc(fmtDay(new Date(k + "T12:00:00")))}</span><span class="small muted">${fmtDur(sum)}</span></h3>
      ${ivs.map(iv => {
        const s = twDate(iv.start), e = iv.end ? twDate(iv.end) : null, key = `${iv.id}|${iv.start}`;
        if (tlEdit === key) return `<form class="tl-edit" data-key="${esc(key)}">
            <input class="txt" type="datetime-local" name="start" value="${localDT(s)}" required>
            ${e ? `– <input class="txt" type="datetime-local" name="end" value="${localDT(e)}" required>` : `<span class="small muted">– still running</span>`}
            <input class="txt" name="tags" value="${esc((iv.tags || []).join(", "))}" required>
            <span><button class="sm primary">Save</button> <button type="button" class="sm" data-tl-cancel>Cancel</button></span></form>`;
        return `<div class="tl-row"><span class="tl-time">${timeRange(s, e)}</span><span class="tl-dur">${fmtDur((e || new Date()) - s)}</span>
          <span class="tl-tags">${(iv.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join(" ") || `<span class="muted small">untagged</span>`}</span>
          <span class="tl-btns"><button class="sm" data-tl-edit="${esc(key)}">Edit</button><button class="sm ghost" data-tl-del="${esc(key)}">Delete</button></span></div>`;
      }).join("")}</div>`;
  }).join("") : `<p class="muted small">Nothing tracked this week. Log time above, or press Start on a task.</p>`);
  const split = key => { const [id, start] = key.split("|"); return { id: +id, start_was: start }; };
  el.querySelectorAll("[data-tl-edit]").forEach(b => b.onclick = () => { tlEdit = b.dataset.tlEdit; renderTimeLog(); });
  el.querySelectorAll("[data-tl-cancel]").forEach(b => b.onclick = () => { tlEdit = null; renderTimeLog(); });
  el.querySelectorAll("[data-tl-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this time entry?")) return;
    try { await post("/api/time/delete", split(b.dataset.tlDel)); toast("Entry deleted"); tlEdit = null; loadTimeLog(); loadTime(); yearIntervals = null; renderActivity(); }
    catch (e) { toast(e.message, true); }
  });
  el.querySelectorAll("form.tl-edit").forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const iv = tlIntervals.find(x => `${x.id}|${x.start}` === f.dataset.key);
    const body = split(f.dataset.key);
    if (f.start.value !== localDT(twDate(iv.start))) body.start = f.start.value;
    if (f.end && f.end.value !== localDT(twDate(iv.end))) body.end = f.end.value;
    const tags = f.tags.value.split(",").map(t => t.trim()).filter(Boolean);
    if (tags.join("|") !== (iv.tags || []).join("|")) body.tags = tags;
    if (f.end && (body.end || localDT(twDate(iv.end))) <= (body.start || localDT(twDate(iv.start)))) return toast("End must be after start", true);
    try { await post("/api/time/modify", body); toast("Entry updated"); tlEdit = null; loadTimeLog(); loadTime(); yearIntervals = null; renderActivity(); }
    catch (err) { toast(err.message, true); }
  });
}
// Task picker for logging time: pending tasks, repeating ones, and tasks done in the last
// two weeks. Picking one fills "what" with the tags the Taskwarrior hook uses when you press
// Start (description, project, task tags), so the time lands on the same task.
const timewTags = t => [t.description, ...(t.project ? [t.project] : []), ...(t.tags || [])];
function renderTaskPicker(sel) {
  const was = sel.value, seen = new Set(), recent = new Date(); recent.setDate(recent.getDate() - 14);
  const group = (label, list) => {
    const opts = list.map(t => ({ t, tags: timewTags(t).join(", ") })).filter(o => !seen.has(o.tags) && seen.add(o.tags))
      .sort((a, b) => a.t.description.localeCompare(b.t.description))
      .map(o => `<option value="${esc(o.tags)}">${esc(o.t.description)}${o.t.project ? ` · ${esc(o.t.project)}` : ""}</option>`).join("");
    return opts ? `<optgroup label="${label}">${opts}</optgroup>` : "";
  };
  sel.innerHTML = `<option value="">Pick a task…</option>` +
    group("Pending", tasks) +
    group("Repeating", (allTasks || []).filter(t => t.status === "recurring")) +
    group("Done recently", (allTasks || []).filter(t => t.status === "completed" && t.end && twDate(t.end) >= recent));
  sel.value = [...sel.options].some(o => o.value === was) ? was : "";
}
$("#tl-add").task.onchange = e => { if (e.target.value) { $("#tl-add").tags.value = e.target.value; $("#tl-add").tags.focus(); } };
$("#tl-add").tags.oninput = e => { if (e.target.value !== e.target.form.task.value) e.target.form.task.value = ""; };
$("#tl-add").onsubmit = async e => {
  e.preventDefault();
  const f = e.target, tags = f.tags.value.split(",").map(t => t.trim()).filter(Boolean);
  let endDay = f.day.value;
  if (f.end.value <= f.start.value) { const d = new Date(f.day.value + "T12:00:00"); d.setDate(d.getDate() + 1); endDay = dayKey(d); }  // past midnight
  try {
    await post("/api/time/track", { start: `${f.day.value}T${f.start.value}`, end: `${endDay}T${f.end.value}`, tags });
    toast("Time logged"); f.start.value = f.end.value = f.tags.value = f.task.value = "";
    loadTimeLog(); loadTime(); yearIntervals = null; renderActivity();
  } catch (err) { toast(err.message, true); }
};
document.querySelectorAll("[data-wk]").forEach(b => b.onclick = () => { tlWeek = +b.dataset.wk === 0 ? 0 : Math.min(0, tlWeek + +b.dataset.wk); tlEdit = null; loadTimeLog(); });

// ---------- time tracking (Timewarrior) ----------
let intervals = [], timeAvailable = true;
const fmtDur = ms => { const m = Math.round(ms / 60000); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };

async function loadTime() {
  try {
    const r = await fetch("/api/time");
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    timeAvailable = j.available; intervals = j.intervals;
  } catch (e) { $("#time-body").innerHTML = `<p class="err">Timewarrior: ${esc(e.message)}</p>`; return; }
  renderTime();
}

function renderTime() {
  const body = $("#time-body");
  body.classList.remove("muted");
  if (!timeAvailable) {
    body.innerHTML = `<p class="muted small">Timewarrior isn't available. Start the dashboard with <code>nix run</code> (or <code>./run.sh</code>) from the site folder.</p>`;
    return;
  }
  const t = Date.now(), dayStart = startOfDay(new Date()).getTime();
  const per = new Map(); let week = 0, today = 0, running = null;
  for (const iv of intervals) {
    const s = twDate(iv.start).getTime(), e = iv.end ? twDate(iv.end).getTime() : t;
    const label = (iv.tags || []).join(" · ") || "untagged";
    per.set(label, (per.get(label) || 0) + (e - s));
    week += e - s;
    today += Math.max(0, e - Math.max(s, dayStart));
    if (!iv.end) running = { label, s };
  }
  const rows = [...per.entries()].sort((a, b) => b[1] - a[1]);
  const max = rows[0]?.[1] || 1;
  body.innerHTML =
    (running ? `<div class="small" style="color:var(--accent);margin-bottom:8px">● Tracking <b>${esc(running.label)}</b> · ${fmtDur(t - running.s)}</div>` : "") +
    `<div style="display:flex;gap:24px;margin-bottom:10px"><div><div class="big">${fmtDur(today)}</div><div class="small muted">today</div></div>
      <div><div class="big">${fmtDur(week)}</div><div class="small muted">this week</div></div></div>` +
    (rows.length ? rows.map(([label, ms]) => `<div style="margin:6px 0"><div class="small" style="display:flex;justify-content:space-between;gap:8px"><span style="overflow-wrap:anywhere">${esc(label)}</span><span class="muted">${fmtDur(ms)}</span></div>
      <div class="progress" style="margin:3px 0 0"><div class="d" style="width:${(ms / max) * 100}%"></div></div></div>`).join("")
      : `<p class="small muted" style="margin:0">Nothing tracked this week. Press <b>Start</b> on a task to start the clock; <b>Stop</b> or <b>Done</b> stops it.</p>`) +
    `<p style="margin:10px 0 0"><a href="#history" class="small link" id="tl-link">Edit or add time →</a></p>`;
  $("#tl-link").onclick = () => setTimeout(() => $("#card-timelog").scrollIntoView({ behavior: "smooth" }), 50);
}
setInterval(() => { if (!document.hidden && intervals.some(iv => !iv.end)) renderTime(); }, 30_000);

// ---------- docs ----------
async function loadDocs() {
  const names = await (await fetch("/api/docs")).json();
  // Your docs first (overview, then the usual ones, then anything else A–Z), the app guides last.
  const order = ["overview.md", "background.md", "nutrition-plan.md", "workout-plan.md", "food-history.md"];
  const guides = ["README.md", "dashboard.md", "noctalia-plugin.md"];
  const rank = n => guides.includes(n) ? 100 + guides.indexOf(n) : (order.indexOf(n) + 1) || 50;
  names.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  const label = n => ({ "README.md": "Getting started", "dashboard.md": "Dashboard guide", "noctalia-plugin.md": "Noctalia plugin" })[n]
    || n.replace(/\.md$/, "").replace(/-/g, " ").replace(/^\w/, c => c.toUpperCase());
  $("#doclist").innerHTML = names.map(n => `<button data-doc="${esc(n)}">${esc(label(n))}</button>`).join("");
  $("#doclist").querySelectorAll("button").forEach(b => b.onclick = () => openDoc(b.dataset.doc));
  let last = null; try { last = localStorage.getItem("doc"); } catch {}
  openDoc(names.includes(last) ? last : names[0]);
}

async function openDoc(name) {
  document.querySelectorAll("#doclist button").forEach(b => b.classList.toggle("on", b.dataset.doc === name));
  const text = await (await fetch("/api/docs/" + encodeURIComponent(name))).text();
  $("#doc").innerHTML = window.marked ? marked.parse(text) : `<pre style="white-space:pre-wrap">${esc(text)}</pre>`;
  $("#doc").querySelectorAll("a[href$='.md']").forEach(a => a.onclick = ev => { ev.preventDefault(); openDoc(a.getAttribute("href")); });
  try { localStorage.setItem("doc", name); } catch {}
}

// ---------- live updates ----------
// Refresh tasks when you come back to the tab and every 2 minutes; roll over at midnight.
function tick() {
  const n = new Date();
  if (dayKey(n) !== todayKey) { now = n; todayKey = dayKey(n); renderToday(); renderStreak(); loadTasks(); }
  else now = n;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); loadTasks(); loadTime(); loadMfp(); } });
setInterval(() => { if (!document.hidden) loadMfp(); }, 300_000);
setInterval(tick, 60_000);
setInterval(() => { if (!document.hidden) loadTasks(); }, 120_000);

// ---------- moving cards ----------
// Drag a Today card by its title to another spot or column. The order is saved in plan.json
// (plan.layout: one list of card ids per column). Narrow screens keep their fixed order.
const todayCols = () => [...document.querySelectorAll("#tab-today .col")];
const readLayout = () => todayCols().map(c => [...c.querySelectorAll(":scope > .card")].map(x => x.id));
const defaultLayout = readLayout();
function applyLayout(layout) {
  const cols = todayCols();
  if (!Array.isArray(layout) || layout.length !== cols.length) layout = defaultLayout;
  layout.forEach((ids, i) => ids.forEach(id => { const card = document.getElementById(id); if (card) cols[i].append(card); }));
  $("#layout-reset").hidden = !plan.layout;
}
(() => {
  const tab = $("#tab-today");
  let dragging = null;
  // Only the title starts a drag, so inputs and text inside cards work as usual.
  tab.addEventListener("pointerdown", e => {
    const h = e.target.closest(".card-head h2");
    if (h && matchMedia("(min-width: 1001px)").matches) h.closest(".card").draggable = true;
  });
  tab.addEventListener("dragstart", e => {
    dragging = e.target.closest?.(".card");
    if (!dragging?.draggable) return;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragging.id);
    requestAnimationFrame(() => { dragging?.classList.add("dragging"); tab.classList.add("moving"); });
  });
  tab.addEventListener("dragover", e => {
    const col = e.target.closest(".col");
    if (!dragging || !col) return;
    e.preventDefault();
    // Insert before the first card whose middle is below the pointer.
    const next = [...col.querySelectorAll(":scope > .card:not(.dragging)")].find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    if (next) { if (next.previousElementSibling !== dragging) col.insertBefore(dragging, next); }
    else if (col.lastElementChild !== dragging) col.append(dragging);
  });
  tab.addEventListener("drop", e => { if (dragging) e.preventDefault(); });
  tab.addEventListener("dragend", () => {
    if (!dragging) return;
    dragging.classList.remove("dragging"); dragging.draggable = false; dragging = null;
    tab.classList.remove("moving");
    const layout = readLayout();
    if (JSON.stringify(layout) === JSON.stringify(plan.layout || defaultLayout)) return;
    plan.layout = layout; $("#layout-reset").hidden = false;
    savePlan("Layout saved");
  });
  tab.addEventListener("pointerup", () => { if (!dragging) tab.querySelectorAll(".card[draggable=true]").forEach(c => c.draggable = false); });
  $("#layout-reset").onclick = () => { delete plan.layout; applyLayout(defaultLayout); savePlan("Layout reset"); };
})();

// ---------- MCPs tab ----------
// Chat with an AI agent (Claude Code, Codex or Gemini CLI) that has the MyFitnessPal MCP and can
// read the docs. The server runs the agent per message and streams the answer as NDJSON; the
// conversation is kept on the server (data/chat.json).
const md = t => window.marked ? marked.parse(esc(t)) : `<p>${esc(t)}</p>`;
const SUGGESTIONS = [["🍽️", "What should I eat for the rest of today?"], ["🍳", "Log 2 eggs and a slice of toast for breakfast"],
  ["🧂", "Why is my sodium so high today?"], ["💪", "How am I doing on protein this week?"]];
const ICONS = {
  leaf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>`,
  send: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`,
  stop: `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`,
};
document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = ICONS.leaf);
$("#chat-send").innerHTML = ICONS.send; $("#chat-stop").innerHTML = ICONS.stop;
const TYPING = `<span class="typing"><i></i><i></i><i></i></span>`;
let chatBusy = false, chatState = null;
const toolChips = tools => tools?.length ? `<div class="tools">${tools.map(t => `<span class="${t.error ? "bad" : ""}">${esc(t.label)}${t.detail ? " · " + esc(t.detail) : ""}</span>`).join("")}</div>` : "";
function chatMsgHtml(m) {
  if (m.role === "user") return `<div class="msg user">${esc(m.text)}</div>`;
  return `<div class="msg bot"><div class="av">${ICONS.leaf}</div><div class="body">${toolChips(m.tools)}<div class="bubble md">${m.text ? md(m.text) : ""}</div>${m.error ? `<div class="err">${esc(m.error)}</div>` : ""}</div></div>`;
}
function renderChat(messages) {
  const log = $("#chat-log");
  log.innerHTML = messages.length ? messages.map(chatMsgHtml).join("")
    : `<div class="chat-empty"><div class="chat-badge">${ICONS.leaf}</div><h3>What did you eat today?</h3>
        <p>Ask about your food and your plan, or tell it what you ate and it'll log it.</p>
        <div class="sugg">${SUGGESTIONS.map(([i, q]) => `<button data-sugg="${esc(q)}"><span>${i}</span>${esc(q)}</button>`).join("")}</div></div>`;
  log.querySelectorAll("[data-sugg]").forEach(b => b.onclick = () => { $("#chat-in").value = b.dataset.sugg; sendChat(); });
  log.scrollTop = log.scrollHeight;
}
async function loadChat() {
  try {
    const c = chatState = await (await fetch("/api/chat")).json();
    $("#mcp-link").href = c.mcp.repo;
    $("#chat-ai").innerHTML = c.providers.map(p => `<option value="${p.id}"${p.id === c.provider ? " selected" : ""}${p.available ? "" : " disabled"}>${esc(p.label)}${p.installed ? "" : p.available ? " (via Nix)" : " (not installed)"}</option>`).join("");
    renderMcpSetup(c.mcp);
    const ai = c.providers.find(p => p.id === c.provider);
    $("#chat-status").className = "chat-status" + (c.mcp.signed_in ? "" : " off");
    $("#chat-status").innerHTML = `<i></i>${c.mcp.signed_in ? "Connected" : "Not connected"} · ${esc(ai?.label || "")}`;
    if (!chatBusy) renderChat(c.messages || []);
  } catch (e) { $("#chat-log").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
// Shown until the MyFitnessPal MCP has a saved login.
function renderMcpSetup(mcp) {
  const el = $("#mcp-setup");
  el.hidden = mcp.signed_in;
  $("#chat-in").disabled = $("#chat-send").disabled = !mcp.signed_in;
  if (mcp.signed_in) return;
  el.innerHTML = `<div class="mcp-setup"><b>Set up the MyFitnessPal MCP first</b><ol>
    <li>Download the <a class="link" href="${esc(mcp.repo)}" target="_blank" rel="noopener">MyFitnessPal MCP</a> (or skip this: the dashboard can run the released package with <code>uv</code>).</li>
    <li>Connect your account: <code>uvx --from 'mfp-mcp[autorefresh]' mfp-mcp auth</code> and paste your MyFitnessPal session cookie, as the MCP's README shows.</li>
    <li>Reload this page.</li></ol></div>`;
}
$("#chat-ai").onchange = async e => {
  const p = chatState.providers.find(x => x.id === e.target.value);
  if (chatState.messages?.length && !confirm(`Start a new chat with ${p.label}?`)) { e.target.value = chatState.provider; return; }
  try { await post("/api/chat/new", { provider: p.id }); await loadChat(); if (!p.installed) toast(`${p.label} downloads through Nix on first use, so the first answer is slower`); }
  catch (err) { toast(err.message, true); e.target.value = chatState.provider; }
};
function setChatBusy(b) {
  chatBusy = b; $("#chat-send").hidden = b; $("#chat-stop").hidden = !b; $("#chat-new").disabled = $("#chat-ai").disabled = b;
}
async function sendChat() {
  const input = $("#chat-in"), message = input.value.trim();
  if (!message || chatBusy) return;
  const log = $("#chat-log");
  log.querySelector(".chat-empty")?.remove();
  log.insertAdjacentHTML("beforeend", chatMsgHtml({ role: "user", text: message }));
  const bot = document.createElement("div");
  bot.className = "msg bot";
  bot.innerHTML = `<div class="av">${ICONS.leaf}</div><div class="body"><div class="tools"></div><div class="bubble md">${TYPING}</div></div>`;
  log.append(bot); log.scrollTop = log.scrollHeight;
  input.value = ""; input.style.height = "auto"; setChatBusy(true);
  const tools = [];
  let text = "", gap = false;
  const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const draw = () => { const stick = nearBottom(); bot.querySelector(".tools").outerHTML = toolChips(tools) || `<div class="tools"></div>`;
    bot.querySelector(".md").innerHTML = text ? md(text) : TYPING; if (stick) log.scrollTop = log.scrollHeight; };
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json", "X-Dashboard": "1" }, body: JSON.stringify({ message }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "text") { text += (gap && text ? "\n\n" : "") + ev.text; gap = false; }
        else if (ev.type === "break") gap = true;
        else if (ev.type === "tool") tools.push({ label: ev.label, detail: ev.detail });
        else if (ev.type === "tool_error") { const t = tools.find(x => x.label === ev.label && x.detail === ev.detail && !x.error); if (t) t.error = true; }
        else if (ev.type === "done") {
          if (ev.error) bot.querySelector(".body").insertAdjacentHTML("beforeend", `<div class="err">${esc(ev.error)}</div>`);
          if (ev.changed) { loadMfp(); toast("MyFitnessPal updated"); }
        }
        draw();
      }
    }
  } catch (e) { bot.querySelector(".body").insertAdjacentHTML("beforeend", `<div class="err">${esc(e.message)}</div>`); }
  if (!text) bot.querySelector(".md").innerHTML = "";
  setChatBusy(false); input.focus();
  if (chatState) chatState.messages = [...(chatState.messages || []), { role: "user", text: message }];
}
$("#chat-form").onsubmit = e => { e.preventDefault(); sendChat(); };
$("#chat-in").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } };
// The message box grows with what you type, up to its max height.
$("#chat-in").oninput = e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; };
$("#chat-stop").onclick = () => post("/api/chat/stop", {}).catch(() => {});
$("#chat-new").onclick = async () => {
  try { await post("/api/chat/new", {}); chatState.messages = []; renderChat([]); $("#chat-in").focus(); } catch (e) { toast(e.message, true); }
};

// ---------- boot ----------
(async () => {
  [plan, checklist, weights] = await Promise.all(["/api/plan", "/api/checklist", "/api/weights"].map(u => fetch(u).then(r => r.ok ? r.json() : Promise.reject(new Error(u)))))
    .catch(async () => [await (await fetch("/plan.json")).json(), {}, []]);  // older server without these endpoints
  applyLayout(plan.layout); renderToday(); renderStreak();
  loadTasks(); loadAllTasks(); loadTime(); loadTimeLog(); loadDocs(); loadMfp(); loadChat();
  let t = location.hash.slice(1); if (!TABS.includes(t)) { t = null; try { t = localStorage.getItem("tab"); } catch {} }
  if (t) showTab(t);
})();
</script>
