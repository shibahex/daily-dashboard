# Builds the container image and publishes it as ghcr.io/<owner>/<repo>, for docker-compose.yml
# to pull. From main it's tagged latest and with the commit (e.g. sha-336abb5). A version tag
# (git tag v1.2.0 && git push origin v1.2.0) also tags it 1.2.0 and 1.2 and makes a GitHub
# Release with notes from the commits since the last one.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # for the release
  packages: write
  actions: write # to clear out old Nix caches

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The Nix store is kept between runs, so only what changed is downloaded or built again.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('site/flake.lock', 'site/go.sum') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # The guide goes into the image: give it this commit's script hashes, even before the
      # Script hashes workflow commits them.
      - run: nix develop --command go run ./cmd/scripthashes
        working-directory: site
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # skopeo compresses a layer to push it, and remembers which compressed layer each one became:
      # kept between runs, that lets it see the registry already has a layer without compressing
      # it again.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/containers/cache
          key: skopeo-blobs-${{ github.run_id }}
          restore-keys: skopeo-blobs-
      # site#image (site/flake.nix) is the image with a layer per package. nix2container pushes it
      # straight from the Nix store: a layer the registry already has is skipped without being
      # written out again, so usually only the pages and the server go up.
      - name: Build and push
        working-directory: site
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix build .#image.copyTo --out-link copy-to
          for tag in $TAGS; do
            ./copy-to/bin/copy-to --dest-creds "${{ github.actor }}:$TOKEN" "docker://$tag"
          done
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
