# Builds the container image and publishes it as ghcr.io/<owner>/<repo>, for docker-compose.yml
# to pull. From main it's tagged latest and with the commit (e.g. sha-336abb5). A version tag
# (git tag v1.2.0 && git push origin v1.2.0) also tags it 1.2.0 and 1.2 and makes a GitHub
# Release with notes from the commits since the last one.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # for the release
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The guide goes into the image: give it this commit's script hashes, even before the
      # Script hashes workflow commits them.
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
          cache: false
      - run: go run ./cmd/scripthashes
        working-directory: site
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
