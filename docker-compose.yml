# The dashboard in Docker or Portainer. Settings go in .env (copy .env.example), or in
# Portainer's environment variables. See "Docker" in docs/dashboard.md.
services:
  dashboard:
    # The image GitHub builds from main. To build it here instead (offline, or not x86-64), add
    # docker-compose.build.yml: see "Docker" in docs/dashboard.md.
    image: ${DASHBOARD_IMAGE:-ghcr.io/shibahex/daily-dashboard:latest}
    pull_policy: always
    container_name: daily-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-1628}:1628"
    environment:
      # Reached over https through your proxy, at whatever hostname it's opened at.
      DASHBOARD_PUBLIC_URL: https://*
      TZ: ${TZ:-UTC}
      # Your reverse proxy reaches the container from a Docker network.
      DASHBOARD_TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - dashboard-data:/app/site/data
    # Signed-in people's data is unlocked into memory (/dev/shm).
    shm_size: 256m
    # The AI's MyFitnessPal and Anki tools run in a bubblewrap sandbox, which makes user
    # namespaces and mounts its own /proc. Without these the dashboard works but those tools don't.
    # On Ubuntu 23.10 and later set DASHBOARD_APPARMOR=podman (see .env.example).
    security_opt:
      - seccomp=unconfined
      - apparmor=${DASHBOARD_APPARMOR:-podman}
      - systempaths=unconfined

volumes:
  dashboard-data:
